  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"21656ea0-9a32-4f0c-af38-397d76821d0f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8c4786e7-352a-47ac-92dc-eb7b1d6c4604\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   FIT FORWARD — Landing Page Design System\n   Brand: navy #1b3663 · orange #ee8027 · ink #1a171b\n   ============================================================ */\n\n/* ---------- Tokens ---------- */\n:root{\n  --navy:#1b3663;\n  --navy-700:#27518f;\n  --navy-900:#11233f;\n  --navy-950:#0c1a30;\n  --orange:#ee8027;\n  --orange-600:#d96b16;\n  --orange-300:#f6b27a;\n  --ink:#1a171b;\n  --paper:#f6f3ec;\n  --paper-2:#efe9de;\n  --mist:#a4afc1;\n  --mist-200:#cdd4df;\n  --line:#e4ddd0;\n  --white:#ffffff;\n\n  /* themable */\n  --head: \"Space Grotesk\", system-ui, sans-serif;\n  --body: \"Manrope\", system-ui, sans-serif;\n  --mono: \"Space Mono\", ui-monospace, monospace;\n  --accent: var(--orange);\n  --accent-ink:#ffffff;\n  --radius: 18px;\n\n  /* tone-driven */\n  --scale: 1;\n  --pad: clamp(88px, 11vh, 150px);\n  --head-weight: 600;\n  --display-track: -0.02em;\n\n  --maxw: 1200px;\n}\n\n/* tone presets */\n[data-tone=\"ruhig\"]{ --scale:0.98; --pad:clamp(96px,13vh,164px); --head-weight:600; --display-track:-0.018em; }\n[data-tone=\"bold\"]{  --scale:1.14; --pad:clamp(80px,10vh,132px); --head-weight:700; --display-track:-0.032em; }\n[data-tone=\"daten\"]{ --scale:0.98; --pad:clamp(66px,8.5vh,108px); --head-weight:600; --display-track:-0.012em; }\n\n/* ---------- Reset / base ---------- */\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }\nbody{\n  font-family:var(--body);\n  background:var(--paper);\n  color:var(--ink);\n  line-height:1.55;\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n  overflow-x:hidden;\n}\nimg{max-width:100%;display:block}\na{color:inherit;text-decoration:none}\nbutton{font-family:inherit}\n::selection{background:var(--orange);color:#fff}\n\n/* ---------- Type ---------- */\n.display{\n  font-family:var(--head);\n  font-weight:var(--head-weight);\n  letter-spacing:var(--display-track);\n  line-height:1.02;\n  font-size:calc(clamp(2.7rem, 6.4vw, 5.4rem) * var(--scale));\n  text-wrap:balance;\n}\nh1,h2,h3,h4{font-family:var(--head);font-weight:var(--head-weight);line-height:1.08;letter-spacing:var(--display-track)}\n.h2{ font-size:calc(clamp(2rem, 4.2vw, 3.4rem) * var(--scale)); line-height:1.06; text-wrap:balance; }\n.h3{ font-size:calc(clamp(1.35rem, 2.2vw, 1.9rem) * var(--scale)); }\n.lead{ font-size:calc(clamp(1.1rem, 1.5vw, 1.4rem) * var(--scale)); line-height:1.5; color:color-mix(in srgb, var(--ink) 78%, transparent); font-weight:450; }\n.eyebrow{\n  font-family:var(--mono);\n  font-size:.78rem;\n  letter-spacing:.18em;\n  text-transform:uppercase;\n  color:var(--orange-600);\n  display:inline-flex;align-items:center;gap:.6em;\n  font-weight:500;\n}\n.eyebrow::before{ content:\"\"; width:26px; height:1.5px; background:currentColor; display:inline-block; }\n.eyebrow.center::before{display:none}\n.muted{ color:color-mix(in srgb, var(--ink) 60%, transparent); }\n\n/* ---------- Layout ---------- */\n.wrap{ max-width:var(--maxw); margin-inline:auto; padding-inline:clamp(20px,5vw,48px); }\n.section{ padding-block:var(--pad); position:relative; }\n.section-head{ max-width:760px; }\n.section-head .eyebrow{ margin-bottom:22px; }\n.section-head .lead{ margin-top:20px; }\n.center{ text-align:center; margin-inline:auto; }\n\n/* dark surfaces */\n.surface-navy{ background:var(--navy); color:#eef1f6; }\n.surface-navy .muted{ color:rgba(238,241,246,.66); }\n.surface-navy .lead{ color:rgba(238,241,246,.8); }\n.surface-ink{ background:var(--ink); color:#f2f0ee; }\n\n/* ---------- Buttons ---------- */\n.btn{\n  display:inline-flex;align-items:center;justify-content:center;gap:.55em;\n  font-family:var(--body);font-weight:650;font-size:1rem;\n  padding:.92em 1.5em;border-radius:999px;border:1.5px solid transparent;\n  cursor:pointer;transition:transform .18s cubic-bezier(.3,.7,.4,1), background .18s, box-shadow .18s, color .18s;\n  white-space:nowrap;line-height:1;\n}\n.btn:hover{ transform:translateY(-2px); }\n.btn:active{ transform:translateY(0); }\n.btn-primary{ background:var(--accent); color:var(--accent-ink); box-shadow:0 10px 24px -10px color-mix(in srgb,var(--accent) 80%, transparent); }\n.btn-primary:hover{ box-shadow:0 16px 30px -10px color-mix(in srgb,var(--accent) 75%, transparent); }\n.btn-ghost{ background:transparent; border-color:color-mix(in srgb,var(--ink) 22%, transparent); color:var(--ink); }\n.btn-ghost:hover{ border-color:var(--ink); background:color-mix(in srgb,var(--ink) 5%, transparent); }\n.surface-navy .btn-ghost{ border-color:rgba(255,255,255,.32); color:#fff; }\n.surface-navy .btn-ghost:hover{ border-color:#fff; background:rgba(255,255,255,.08); }\n.btn-arrow{ font-size:1.05em; transition:transform .18s; }\n.btn:hover .btn-arrow{ transform:translateX(3px); }\n.btn-sm{ padding:.7em 1.15em; font-size:.92rem; }\n\n/* ---------- Coming soon banner ---------- */\n.announce{\n  position:fixed; top:0; left:0; right:0; z-index:120;\n  display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;\n  padding:9px 20px;\n  background:var(--navy); color:#eef1f6;\n  font-size:.86rem; line-height:1.3;\n  border-bottom:1px solid rgba(255,255,255,.08);\n}\n.announce-pill{\n  font-family:var(--mono); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase;\n  font-weight:700; color:var(--navy); background:var(--orange);\n  padding:.34em .66em; border-radius:999px; white-space:nowrap;\n}\n.announce-txt{ color:rgba(238,241,246,.82); white-space:nowrap; }\n.announce-link{ display:inline-flex; align-items:center; gap:.4em; font-weight:650; color:#fff; white-space:nowrap; }\n.announce-link:hover{ color:var(--orange-300); }\n.announce-link:hover .btn-arrow{ transform:translateX(3px); }\n@media(max-width:560px){\n  .announce{ gap:8px; padding:8px 14px; font-size:.78rem; }\n  .announce-txt{ display:none; }\n}\n\n/* ---------- Nav ---------- */\n.nav{\n  position:fixed; top:var(--announce-h, 0px); left:0; right:0; z-index:100;\n  display:flex;align-items:center;justify-content:space-between;\n  padding:18px clamp(20px,5vw,48px);\n  transition:background .3s, box-shadow .3s, padding .3s, backdrop-filter .3s;\n}\n.nav.scrolled{\n  background:color-mix(in srgb, var(--paper) 82%, transparent);\n  backdrop-filter:blur(16px) saturate(140%);\n  -webkit-backdrop-filter:blur(16px) saturate(140%);\n  box-shadow:0 1px 0 var(--line);\n  padding-block:13px;\n}\n.nav-logo{ height:30px; width:auto; }\n.nav-logo.white{ display:none; }\n.nav-links{ display:flex; align-items:center; gap:34px; }\n.nav-links a{ font-size:.95rem; font-weight:550; color:color-mix(in srgb,var(--ink) 72%, transparent); transition:color .15s; }\n.nav-links a:hover{ color:var(--ink); }\n.nav-actions{ display:flex; align-items:center; gap:14px; }\n@media(max-width:860px){ .nav-links{display:none} }\n\n/* ---------- Hero ---------- */\n.hero{ padding-top:calc(clamp(130px,18vh,200px) + var(--announce-h, 0px)); padding-bottom:var(--pad); position:relative; overflow:hidden; }\n.hero-grid{ display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(36px,5vw,72px); align-items:center; }\n.hero-copy h1{ margin:24px 0 0; }\n.hero-copy .lead{ margin-top:26px; max-width:30ch; }\n.hero-cta{ display:flex; gap:14px; margin-top:38px; flex-wrap:wrap; }\n.hero-note{ margin-top:26px; display:flex; align-items:center; gap:10px; font-size:.9rem; color:color-mix(in srgb,var(--ink) 55%, transparent); }\n.hero-note .dot{ width:7px;height:7px;border-radius:50%;background:#34c759;box-shadow:0 0 0 3px color-mix(in srgb,#34c759 25%,transparent); }\n[data-hero=\"navy\"] .hero{ background:var(--navy); color:#eef1f6; }\n[data-hero=\"navy\"] .hero .lead{ color:rgba(238,241,246,.8); }\n[data-hero=\"navy\"] .hero .hero-note{ color:rgba(238,241,246,.6); }\n[data-hero=\"navy\"] .hero .btn-ghost{ border-color:rgba(255,255,255,.3); color:#fff; }\n[data-hero=\"navy\"] .hero .eyebrow{ color:var(--orange-300); }\n\n/* hero visual = big whale + app card mock */\n.hero-visual{ position:relative; display:flex; flex-direction:column; align-items:center; }\n.hero-whale{\n  position:relative; z-index:0; pointer-events:none;\n  width:min(82%, 360px);\n  margin-bottom:-58px;\n  filter:drop-shadow(0 24px 36px rgba(17,35,63,.14));\n}\n.hero-whale.white{ display:none; }\n[data-hero=\"navy\"] .hero-whale.navy{ display:none; }\n[data-hero=\"navy\"] .hero-whale.white{ display:block; }\n.hero-visual .appcard{ position:relative; z-index:1; width:100%; }\n\n/* ---------- App mock (phone-ish card) ---------- */\n.appcard{\n  background:var(--white);\n  border-radius:26px;\n  box-shadow:0 40px 80px -30px rgba(17,35,63,.4), 0 2px 0 rgba(255,255,255,.6) inset;\n  border:1px solid var(--line);\n  padding:22px;\n  position:relative;\n  overflow:hidden;\n}\n.appcard-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }\n.appcard-top .when{ font-family:var(--mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--mist); }\n.appcard-top .day{ font-family:var(--head); font-weight:600; font-size:1.15rem; color:var(--navy); }\n.pill{ font-family:var(--mono); font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; padding:.45em .7em; border-radius:999px; background:color-mix(in srgb,var(--orange) 14%,transparent); color:var(--orange-600); font-weight:500; }\n\n/* energy rings row */\n.rings{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:4px 0 18px; }\n.ring{ text-align:center; }\n.ring svg{ width:100%; max-width:88px; height:auto; margin-inline:auto; }\n.ring .rv{ font-family:var(--head); font-weight:600; font-size:1.05rem; fill:var(--navy); }\n.ring .rl{ font-family:var(--mono); font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; color:var(--mist); margin-top:6px; }\n\n/* recommended session block */\n.rec{ background:var(--paper); border-radius:16px; padding:16px; border:1px solid var(--line); }\n.rec-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }\n.rec-title{ font-family:var(--head); font-weight:600; font-size:1.1rem; color:var(--ink); }\n.rec-meta{ font-size:.82rem; color:color-mix(in srgb,var(--ink) 55%,transparent); }\n.rec-why{ font-size:.86rem; line-height:1.45; color:color-mix(in srgb,var(--ink) 68%,transparent); margin-top:4px; }\n.rec-why b{ color:var(--orange-600); font-weight:650; }\n.rec-cta{ margin-top:14px; width:100%; }\n\n/* ---------- Generic cards / grids ---------- */\n.grid{ display:grid; gap:22px; }\n.g-3{ grid-template-columns:repeat(3,1fr); }\n.g-2{ grid-template-columns:repeat(2,1fr); }\n.card{\n  background:var(--white);\n  border:1px solid var(--line);\n  border-radius:var(--radius);\n  padding:30px;\n  transition:transform .25s cubic-bezier(.3,.7,.4,1), box-shadow .25s;\n}\n.card:hover{ transform:translateY(-4px); box-shadow:0 26px 50px -30px rgba(17,35,63,.35); }\n.surface-navy .card{ background:var(--navy-900); border-color:rgba(255,255,255,.09); }\n.card .ic{ width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:20px; background:color-mix(in srgb,var(--accent) 14%,transparent); }\n.card h3{ font-size:1.3rem; margin-bottom:10px; }\n.card p{ color:color-mix(in srgb,var(--ink) 64%,transparent); font-size:1rem; }\n.surface-navy .card p{ color:rgba(238,241,246,.7); }\n\n/* number tag */\n.numtag{ font-family:var(--mono); font-size:.8rem; letter-spacing:.1em; color:var(--orange-600); font-weight:500; }\n\n/* ---------- Energy pillar (detailed) ---------- */\n.pillar{ position:relative; }\n.pillar .bar{ height:6px; border-radius:999px; background:color-mix(in srgb,var(--ink) 8%,transparent); overflow:hidden; margin-top:auto; }\n.pillar .bar i{ display:block; height:100%; border-radius:999px; width:0; transition:width 1.1s cubic-bezier(.2,.7,.2,1); }\n\n/* ---------- Manifesto ---------- */\n.manifesto{ text-align:center; }\n.manifesto .quote{\n  font-family:var(--head); font-weight:var(--head-weight);\n  font-size:calc(clamp(1.9rem,3.8vw,3.2rem) * var(--scale));\n  line-height:1.16; letter-spacing:-0.02em; text-wrap:balance;\n  max-width:18ch; margin:30px auto 0;\n}\n.manifesto .quote .hl{ color:var(--orange); }\n.manifesto cite{ display:block; margin-top:30px; font-style:normal; font-family:var(--mono); font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; color:rgba(238,241,246,.55); }\n\n/* ---------- Day timeline ---------- */\n.daystrip{ display:flex; flex-direction:column; gap:2px; background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:20px; }\n.slot{ display:grid; grid-template-columns:62px 1fr; gap:16px; align-items:center; padding:11px 6px; border-radius:10px; }\n.slot .t{ font-family:var(--mono); font-size:.78rem; color:var(--mist); letter-spacing:.04em; }\n.slot .ev{ font-size:.95rem; font-weight:550; color:color-mix(in srgb,var(--ink) 78%,transparent); display:flex; align-items:center; gap:10px; }\n.slot .ev .chip{ width:9px;height:9px;border-radius:3px;background:var(--mist-200);flex:none; }\n.slot.work{ }\n.slot.train{ background:color-mix(in srgb,var(--orange) 10%,transparent); }\n.slot.train .ev{ color:var(--ink); font-weight:700; }\n.slot.train .ev .chip{ background:var(--orange); }\n.slot.train .t{ color:var(--orange-600); }\n\n/* ---------- Steps / onboarding ---------- */\n.steps{ counter-reset:step; display:grid; gap:22px; grid-template-columns:repeat(3,1fr); }\n.step{ background:var(--navy-900); border:1px solid rgba(255,255,255,.09); border-radius:var(--radius); padding:28px; position:relative; }\n.step .n{ font-family:var(--head); font-weight:700; font-size:2.4rem; color:var(--orange); line-height:1; }\n.step h3{ margin:14px 0 8px; font-size:1.25rem; color:#fff; }\n.step p{ color:rgba(238,241,246,.7); font-size:.96rem; }\n\n/* connectors integration logos */\n.intg{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }\n.intg span{ font-family:var(--mono); font-size:.72rem; padding:.4em .7em; border-radius:8px; border:1px solid rgba(255,255,255,.16); color:rgba(238,241,246,.75); letter-spacing:.04em; }\n\n/* ---------- Charts ---------- */\n.chartcard{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:26px; }\n.chartcard .ch-h{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }\n.chartcard .ch-h h3{ font-size:1.15rem; }\n.chartcard .big{ font-family:var(--head); font-weight:700; font-size:2.6rem; color:var(--navy); line-height:1; letter-spacing:-.02em; }\n.chartcard .big small{ font-size:1rem; color:var(--mist); font-weight:500; }\n.chartcard .delta{ font-family:var(--mono); font-size:.8rem; color:#1f9d55; font-weight:500; }\n.chartcard svg{ width:100%; height:auto; display:block; overflow:visible; }\n.chart-cap{ font-size:.85rem; color:color-mix(in srgb,var(--ink) 55%,transparent); margin-top:14px; }\n\n/* streak dots */\n.streak{ display:grid; grid-template-columns:repeat(14,1fr); gap:5px; margin-top:8px; }\n.streak i{ aspect-ratio:1; border-radius:4px; background:color-mix(in srgb,var(--ink) 8%,transparent); }\n.streak i.on{ background:var(--orange); }\n.streak i.soft{ background:var(--orange-300); }\n\n/* ---------- Check-in / readiness ---------- */\n.readwrap{ display:grid; grid-template-columns:auto 1fr; gap:30px; align-items:center; }\n.gauge{ position:relative; width:200px; height:200px; flex:none; }\n.gauge .gv{ position:absolute; inset:0; display:grid; place-content:center; text-align:center; }\n.gauge .gv b{ font-family:var(--head); font-weight:700; font-size:3rem; color:var(--navy); line-height:1; }\n.gauge .gv span{ font-family:var(--mono); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--mist); }\n.checklist{ display:flex; flex-direction:column; gap:14px; }\n.checkrow{ display:flex; align-items:center; gap:14px; font-size:1rem; }\n.checkrow .k{ width:120px; color:color-mix(in srgb,var(--ink) 60%,transparent); font-size:.92rem; }\n.checkrow .track{ flex:1; height:8px; border-radius:999px; background:color-mix(in srgb,var(--ink) 8%,transparent); overflow:hidden; }\n.checkrow .track i{ display:block; height:100%; border-radius:999px; width:0; transition:width 1s cubic-bezier(.2,.7,.2,1); }\n.checkrow .v{ font-family:var(--mono); font-size:.82rem; width:42px; text-align:right; color:var(--navy); }\n\n/* ---------- Whale coach ---------- */\n.coach{ display:grid; grid-template-columns:.9fr 1.1fr; gap:clamp(34px,5vw,70px); align-items:center; }\n.coach-art{ position:relative; display:grid; place-items:center; padding:30px; }\n.coach-art .halo{ position:absolute; inset:0; margin:auto; width:78%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb,var(--orange) 22%,transparent), transparent 68%); }\n.coach-art img{ position:relative; width:min(78%,320px); }\n\n/* ---------- Testimonial ---------- */\n.quotecard{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:38px; }\n.quotecard p{ font-family:var(--head); font-weight:500; font-size:calc(1.4rem * var(--scale)); line-height:1.3; letter-spacing:-.01em; color:var(--ink); text-wrap:balance; }\n.quotecard footer{ display:flex; align-items:center; gap:14px; margin-top:24px; }\n.quotecard .av{ width:46px; height:46px; border-radius:50%; overflow:hidden; flex:none; background:var(--paper-2); }\n.quotecard .who b{ display:block; font-weight:650; font-size:.98rem; }\n.quotecard .who span{ font-size:.85rem; color:color-mix(in srgb,var(--ink) 55%,transparent); }\n\n/* ---------- Final CTA ---------- */\n.cta-final{ text-align:center; position:relative; overflow:hidden; }\n.cta-final .display{ max-width:16ch; margin:24px auto 0; }\n.cta-final .lead{ margin:22px auto 0; max-width:46ch; }\n.cta-form{ display:flex; gap:12px; justify-content:center; margin-top:36px; flex-wrap:wrap; }\n.cta-form input{ font-family:var(--body); font-size:1rem; padding:.92em 1.3em; border-radius:999px; border:1.5px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; min-width:280px; outline:none; }\n.cta-form input::placeholder{ color:rgba(255,255,255,.55); }\n.cta-form input:focus{ border-color:var(--orange); }\n\n/* ---------- Footer ---------- */\n.footer{ background:var(--ink); color:rgba(242,240,238,.7); padding-block:60px 40px; }\n.footer-top{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:36px; }\n.footer h4{ font-family:var(--mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:rgba(242,240,238,.45); margin-bottom:16px; font-weight:500; }\n.footer ul{ list-style:none; display:flex; flex-direction:column; gap:10px; }\n.footer a{ font-size:.95rem; color:rgba(242,240,238,.72); }\n.footer a:hover{ color:#fff; }\n.footer-logo{ height:30px; margin-bottom:18px; }\n.footer-bottom{ display:flex; align-items:center; justify-content:space-between; margin-top:48px; padding-top:24px; border-top:1px solid rgba(255,255,255,.1); font-size:.85rem; color:rgba(242,240,238,.45); flex-wrap:wrap; gap:12px; }\n\n/* ---------- Decorative whale ---------- */\n.whale-deco{ position:absolute; pointer-events:none; opacity:.06; z-index:0; }\n[data-whale=\"dezent\"] .whale-deco{ display:none; }\n.section > .wrap{ position:relative; z-index:1; }\n\n/* ---------- How it works rows ---------- */\n.howrow{ display:flex; gap:14px; align-items:flex-start; font-size:1.02rem; line-height:1.5; color:color-mix(in srgb,var(--ink) 70%,transparent); }\n.howrow b{ color:var(--ink); font-weight:700; }\n.howdot{ flex:none; width:22px; height:22px; border-radius:50%; margin-top:3px; background:color-mix(in srgb,var(--orange) 16%,transparent); position:relative; }\n.howdot::after{ content:\"\"; position:absolute; inset:0; margin:auto; width:7px; height:7px; border-radius:50%; background:var(--orange); }\n\n/* ---------- Coach bubbles ---------- */\n.coachbubble{ background:var(--navy-900); border:1px solid rgba(255,255,255,.1); border-radius:14px 14px 14px 4px; padding:13px 18px; font-size:.98rem; color:rgba(238,241,246,.9); line-height:1.4; align-self:flex-start; }\n.coachbubble.alt{ background:color-mix(in srgb,var(--orange) 16%,transparent); border-color:color-mix(in srgb,var(--orange) 30%,transparent); color:#fbe3ce; }\n\n/* ---------- Reveal (gated on .js so content shows without JavaScript) ---------- */\nhtml.js .reveal{ opacity:0; transform:translateY(26px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); }\nhtml.js .reveal.in{ opacity:1; transform:none; }\n.reveal[data-d=\"1\"]{ transition-delay:.08s } .reveal[data-d=\"2\"]{ transition-delay:.16s } .reveal[data-d=\"3\"]{ transition-delay:.24s } .reveal[data-d=\"4\"]{ transition-delay:.32s }\n@media (prefers-reduced-motion: reduce){ html.js .reveal{ opacity:1 !important; transform:none !important; transition:none } html{scroll-behavior:auto} }\n\n/* ---------- Bilingual toggle =\"announce-pill\">Coming soon<\u002Fspan>\n  <span class=\"announce-txt\"><span class=\"de\">Fit Forward startet bald — sichere dir deinen Early Access.<\u002Fspan><span class=\"en\">Fit Forward launches soon — secure your early access.<\u002Fspan><\u002Fspan>\n  <a href=\"#cta\" class=\"announce-link\"><span class=\"de\">Jetzt eintragen<\u002Fspan><span class=\"en\">Join now<\u002Fspan> <span class=\"btn-arrow\">→<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n\n<!-- ============ NAV ============ -->\n<nav class=\"nav\" id=\"nav\">\n  <a href=\"#top\" aria-label=\"Fit Forward\">\n    <img class=\"nav-logo color\" src=\"7436ab36-86d5-4c7e-8517-d443cd07b205\" alt=\"Fit Forward\">\n    <img class=\"nav-logo white\" src=\"bba1a69e-28c0-441d-bbed-d60122a6a441\" alt=\"Fit Forward\">\n  <\u002Fa>\n  <div class=\"nav-links\">\n    <a href=\"#how\"><span class=\"de\">So funktioniert's<\u002Fspan><span class=\"en\">How it works<\u002Fspan><\u002Fa>\n    <a href=\"#energy\"><span class=\"de\">Energie-Zustand<\u002Fspan><span class=\"en\">Energy state<\u002Fspan><\u002Fa>\n    <a href=\"#progress\"><span class=\"de\">Fortschritt<\u002Fspan><span class=\"en\">Progress<\u002Fspan><\u002Fa>\n    <a href=\"#coach\">Coach<\u002Fa>\n  <\u002Fdiv>\n  <div class=\"nav-actions\">\n    <label for=\"ff-lang\" class=\"lang-switch\" title=\"Switch language / Sprache wechseln\"><span class=\"de\">EN<\u002Fspan><span class=\"en\">DE<\u002Fspan><\u002Flabel>\n    <a href=\"#cta\" class=\"btn btn-primary btn-sm\"><span class=\"de\">Auf die Warteliste<\u002Fspan><span class=\"en\">Join the waitlist<\u002Fspan><\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<span id=\"top\"><\u002Fspan>\n\n<!-- ============ HERO ============ -->\n<header class=\"hero\" data-screen-label=\"Hero\">\n  <div class=\"wrap\">\n    <div class=\"hero-grid\">\n      <div class=\"hero-copy\">\n        <span class=\"eyebrow reveal\"><span class=\"de\">Adaptives Ausdauertraining<\u002Fspan><span class=\"en\">Adaptive endurance training<\u002Fspan><\u002Fspan>\n        <h1 class=\"display reveal\" data-d=\"1\"><span class=\"de\">Werde stärker,<br>ohne dein Leben<br>umzubauen.<\u002Fspan><span class=\"en\">Get stronger<br>without rebuilding<br>your life.<\u002Fspan><\u002Fh1>\n        <p class=\"lead reveal\" data-d=\"2\"><span class=\"de\">Fit Forward findet für jeden Moment die passende Einheit — abgestimmt auf deine Energie, deinen Kalender und dein Ziel. So bleibst du dran, wenn der Alltag dazwischenkommt.<\u002Fspan><span class=\"en\">Fit Forward finds the right session for every moment — matched to your energy, your calendar and your goal. So you keep going when life gets in the way.<\u002Fspan><\u002Fp>\n        <div class=\"hero-cta reveal\" data-d=\"3\">\n          <a href=\"#cta\" class=\"btn btn-primary\"><span class=\"de\">Auf die Warteliste<\u002Fspan><span class=\"en\">Join the waitlist<\u002Fspan><\u002Fa>\n          <a href=\"#how\" class=\"btn btn-ghost\"><span class=\"de\">So funktioniert's<\u002Fspan><span class=\"en\">How it works<\u002Fspan> <span class=\"btn-arrow\">→<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n        <div class=\"hero-note reveal\" data-d=\"4\">\n          <span class=\"dot\"><\u002Fspan> <span class=\"de\">Verbindet sich mit TrainingPeaks, Whoop &amp; Apple Health<\u002Fspan><span class=\"en\">Connects with TrainingPeaks, Whoop &amp; Apple Health<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"hero-visual reveal\" data-d=\"2\">\n        <img class=\"hero-whale navy\" src=\"1ea7d08e-282b-46ec-9934-33b08b0b254b\" alt=\"\" aria-hidden=\"true\">\n        <img class=\"hero-whale white\" src=\"8e2de0fb-5bd9-45ef-8cd4-d0fb5d38d59c\" alt=\"\" aria-hidden=\"true\">\n        <div class=\"appcard\">\n          <div class=\"appcard-top\">\n            <div>\n              <div class=\"when\"><span class=\"de\">Heute · Dienstag<\u002Fspan><span class=\"en\">Today · Tuesday<\u002Fspan><\u002Fdiv>\n              <div class=\"day\"><span class=\"de\">Dei <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"rec\">\n            <div class=\"rec-h\">\n              <div class=\"rec-title\"><span class=\"de\">Lockerer Dauerlauf<\u002Fspan><span class=\"en\">Easy run<\u002Fspan><\u002Fdiv>\n              <div class=\"rec-meta\"><span class=\"de\">35 Min · Zone 2<\u002Fspan><span class=\"en\">35 min · Zone 2<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"rec-why\"><span class=\"de\">Deine <b>Energie ist niedrig<\u002Fb> und der Stress erhöht. Heute hältst du es leicht — das schützt deine Form für die harte Einheit am Donnerstag.<\u002Fspan><span class=\"en\">Your <b>energy is low<\u002Fb> and stress is elevated. Keep it easy today — that protects your form for Thursday's hard session.<\u002Fspan><\u002Fdiv>\n            <button class=\"btn btn-primary rec-cta\"><span class=\"de\">Einheit starten<\u002Fspan><span class=\"en\">Start session<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============ MANIFESTO ============ -->\n<section class=\"section surface-navy manifesto\" data-screen-label=\"Philosophie\">\n  <img class=\"whale-deco\" src=\"8e2de0fb-5bd9-45ef-8cd4-d0fb5d38d59c\" alt=\"\" aria-hidden=\"true\" style=\"width:340px;right:-40px;bottom:-60px;transform:scaleX(-1)\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow center reveal\" style=\"color:var(--orange-300)\"><span class=\"de\">Die Philosophie<\u002Fspan><span class=\"en\">The philosophy<\u002Fspan><\u002Fspan>\n    <blockquote class=\"quote reveal\" data-d=\"1\">\n      <span class=\"de\">Fortschritt ist nicht, an guten Tagen alles zu geben. Sondern das zu finden, woran du auch an <span class=\"hl\">durchschnittlichen Tagen noch Spaß hast.<\u002Fspan><\u002Fspan><span class=\"en\">Progress isn't about giving everything on your best days. It's about finding what you still <span class=\"hl\">enjoy on your average ones.<\u002Fspan><\u002Fspan>\n    <\u002Fblockquote>\n    <cite class=\"reveal\" data-d=\"2\"><span class=\"de\">Das Prinzip hinter Fit Forward<\u002Fspan><span class=\"en\">The principle behind Fit Forward<\u002Fspan><\u002Fcite>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ENERGY STATE ============ -->\n<section class=\"section\" id=\"energy\" data-screen-label=\"Energie-Zustand\">\n  <img class=\"whale-deco\" src=\"1ea7d08e-282b-46ec-9934-33b08b0b254b\" alt=\"\" aria-hidden=\"true\" style=\"width:300px;left:-50px;top:40px\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\"><span class=\"de\">Dein Energie-Zustand<\u002Fspan><span class=\"en\">Your energy state<\u002Fspan><\u002Fspan>\n      <h2 class=\"h2\"><span class=\"de\">Dein Training liest, wie es dir geht.<\u002Fspan><span class=\"en\">Your training reads how you're doing.<\u002Fspan><\u002Fh2>\n      <p class=\"lead\"><span class=\"de\">Jede Empfehlung beginnt mit drei Signalen. Zusammen ergeben sie das vollständige Bild deiner Tagesform — und entscheiden, was heute zählt.<\u002Fspan><span class=\"en\">Every recommendation starts with three signals. Together they paint the full picture of your daily form — and decide what matters today.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div class=\"grid g-3\" style=\"margin-top:54px\">\n      <article class=\"card reveal\" data-d=\"1\" style=\"display:flex;flex-direction:column;min-height:300px\">\n        <div class=\"numtag\"><span class=\"de\">01 — Ernährung<\u002Fspan><span class=\"en\">01 — Nutrition<\u002Fspan><\u002Fdiv>\n        <h3 style=\"margin-top:14px\"><span class=\"de\">Energie<\u002Fspan><span class=\"en\">Energy<\u002Fspan><\u002Fh3>\n        <p style=\"flex:1\"><span class=\"de\">Wie viel Energie steckt im Tank? Aus deiner Ernährung und den letzten Einheiten schätzen wir deine verfügbaren Reserven.<\u002Fspan><span class=\"en\">How full is the tank? From your nutrition and recent sessions we estimate your available reserves.<\u002Fspan><\u002Fp>\n        <div class=\"bar\"><i style=\"background:var(--orange)\" data-w=\"64\"><\u002Fi><\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"card reveal\" data-d=\"2\" style=\"display:flex;flex-direction:column;min-height:300px\">\n        <div class=\"numtag\"><span class=\"de\">02 — Körper<\u002Fspan><span class=\"en\">02 — Body<\u002Fspan><\u002Fdiv>\n        <h3 style=\"margin-top:14px\"><span class=\"de\">Belastung<\u002Fspan><span class=\"en\">Load<\u002Fspan><\u002Fh3>\n        <p style=\"flex:1\"><span class=\"de\">Wie viel Strain trägst du noch mit dir? Trainingslast und Erholung zeigen, was dein Körper heute wirklich verkraftet.<\u002Fspan><span class=\"en\">How much strain are you still carrying? Training load and recovery show what your body can really handle today.<\u002Fspan><\u002Fp>\n        <div class=\"bar\"><i style=\"background:var(--navy)\" data-w=\"47\"><\u002Fi><\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"card reveal\" data-d=\"3\" style=\"display:flex;flex-direction:column;min-height:300px\">\n        <div class=\"numtag\"><span class=\"de\">03 — Kopf<\u002Fspan><span class=\"en\">03 — Mind<\u002Fspan><\u002Fdiv>\n        <h3 style=\"margin-top:14px\">Stress<\u002Fh3>\n        <p style=\"flex:1\"><span class=\"de\">Wie ist dein Kopf? Schlaf, HRV und Alltagsstress entscheiden mit, ob heute Vollgas oder Regeneration die richtige Antwort ist.<\u002Fspan><span class=\"en\">How's your head? Sleep, HRV and everyday stress help decide whether today calls for full gas or recovery.<\u002Fspan><\u002Fp>\n        <div class=\"bar\"><i style=\"background:#27518f\" data-w=\"38\"><\u002Fi><\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ HOW IT WORKS ============ -->\n<section class=\"section\" id=\"how\" style=\"background:var(--paper-2)\" data-screen-label=\"So funktioniert's\">\n  <div class=\"wrap\">\n    <div class=\"hero-grid\" style=\"align-items:center\">\n      <div class=\"reveal\">\n        <span class=\"eyebrow\"><span class=\"de\">So funktioniert's<\u002Fspan><span class=\"en\">How it works<\u002Fspan><\u002Fspan>\n        <h2 class=\"h2\" style=\"margin-top:18px\"><span class=\"de\">Der perfekte Workout für jeden Moment.<\u002Fspan><span class=\"en\">The perfect workout for every moment.<\u002Fspan><\u002Fh2>\n        <p class=\"lead\" style=\"margin-top:20px\"><span class=\"de\">Fit Forward kennt deinen Zustand und deinen Kalender — und legt die richtige Einheit genau dorthin, wo sie hinpasst.<\u002Fspan><span class=\"en\">Fit Forward knows your state and your calendar — and places the right session exactly where it fits.<\u002Fspan><\u002Fp>\n        <ul style=\"list-style:none;margin-top:32px;display:flex;flex-direction:column;gap:18px\">\n          <li class=\"howrow\"><span class=\"howdot\"><\u002Fspan><div><span class=\"de\"><b>Liest deinen Zustand.<\u002Fb> Energie, Belastung und Stress fließen in jede Empfehlung ein.<\u002Fspan><span class=\"en\"><b>Reads your state.<\u002Fb> Energy, load and stress feed into every recommendation.<\u002Fspan><\u002Fdiv><\u002Fli>\n          <li class=\"howrow\"><span class=\"howdot\"><\u002Fspan><div><span class=\"de\"><b>Wählt Typ, Dauer &amp; Intensität.<\u002Fb> Vom 20-Minuten-Reiz bis zur langen Einheit am Wochenende.<\u002Fspan><span class=\"en\"><b>Picks type, duration &amp; intensity.<\u002Fb> From a 20-minute stimulus to the long weekend session.<\u002Fspan><\u002Fdiv><\u002Fli>\n          <li class=\"howrow\"><span class=\"howdot\"><\u002Fspan><div><span class=\"de\"><b>Findet den freien Slot.<\u002Fb> Die Einheit landet in der Lücke, die dein Kalender hergibt.<\u002Fspan><span class=\"en\"><b>Finds the open slot.<\u002Fb> The session lands in the gap your calendar allows.<\u002Fspan><\u002Fdiv><\u002Fli>\n          <li class=\"howrow\"><span class=\"howdot\"><\u002Fspan><div><span class=\"de\"><b>Passt sich an.<\u002Fb> Verschiebt sich dein Tag, verschiebt sich dein Plan — automatisch.<\u002Fspan><span class=\"en\"><b>Adapts.<\u002Fb> If your day shifts, your plan shifts — automatically.<\u002Fspan><\u002Fdiv><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"reveal\" data-d=\"2\">\n        <div class=\"daystrip\">\n          <div class=\"slot\"><span class=\"t\">07:00<\u002Fspan><span class=\"ev\"><span class=\"chip\"><\u002Fspan><span class=\"de\">Morgen-Check-in<\u002Fspan><span class=\"en\">Morning check-in<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"slot\"><span class=\"t\">09:00<\u002Fspan><span class=\"ev\"><span class=\"chip\"><\u002Fspan><span class=\"de\">Team-Meeting<\u002Fspan><span class=\"en\">Team meeting<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"slot\"><span class=\"t\">12:30<\u002Fspan><span class=\"ev\"><span class=\"chip\"><\u002Fspan><span class=\"de\">Mittagspause<\u002Fspan><span class=\"en\">Lunch break<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"slot\"><span class=\"t\">14:00<\u002Fspan><span class=\"ev\"><span class=\"chip\"><\u002Fspan><span class=\"de\">Deep Work<\u002Fspan><span class=\"en\">Deep work<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"slot train\"><span class=\"t\">18:15<\u002Fspan><span class=\"ev\"><span class=\"chip\"><\u002Fspan><span class=\"de\">Lauf · 35 Min · Zone 2<\u002Fspan><span class=\"en\">Run · 35 min · Zone 2<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"slot\"><span class=\"t\">20:00<\u002Fspan><span class=\"ev\"><span class=\"chip\"><\u002Fspan><span class=\"de\">Abendessen<\u002Fspan><span class=\"en\">Dinner<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-family:var(--mono);font-size:.78rem;color:color-mix(in srgb,var(--ink) 50%,transparent);margin-top:16px;text-align:center;letter-spacing:.03em\"><span class=\"de\">Einheit automatisch in die Abend-Lücke gelegt<\u002Fspan><span class=\"en\">Session placed automatically into the evening gap<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ONBOARDING ============ -->\n<section class=\"section surface-navy\" id=\"onboarding\" data-screen-label=\"Onboarding\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\" style=\"text-align:center\">\n      <span class=\"eyebrow center\" style=\"color:var(--orange-300)\">Onboarding<\u002Fspan>\n      <h2 class=\"h2\" style=\"margin-top:18px\"><span class=\"de\">In drei Minuten startklar.<\u002Fspan><span class=\"en\">Ready in three minutes.<\u002Fspan><\u002Fh2>\n      <p class=\"lead\" style=\"margin-inline:auto\"><span class=\"de\">Keine 40-seitige Einrichtung. Drei Schritte — und dein Coach plant ab heute um dein Leben herum.<\u002Fspan><span class=\"en\">No 40-page setup. Three steps — and your coach plans around your life from today.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div class=\"steps\" style=\"margin-top:54px\">\n      <article class=\"step reveal\" data-d=\"1\">\n        <div class=\"n\">1<\u002Fdiv>\n        <h3><span class=\"de\">Ziel &amp; Sportarten<\u002Fspan><span class=\"en\">Goal &amp; sports<\u002Fspan><\u002Fh3>\n        <p><span class=\"de\">Sag uns, worauf du hinarbeitest — Marathon, Triathlon oder einfach konstant fitter werden.<\u002Fspan><span class=\"en\">Tell us what you're working toward — marathon, triathlon or simply getting consistently fitter.<\u002Fspan><\u002Fp>\n      <\u002Farticle>\n      <article class=\"step reveal\" data-d=\"2\">\n        <div class=\"n\">2<\u002Fdiv>\n        <h3><span class=\"de\">Dein Alltag<\u002Fspan><span class=\"en\">Your everyday<\u002Fspan><\u002Fh3>\n        <p><span class=\"de\">Arbeitszeiten, Pendelwege und freie Slots. So plant Fit Forward realistisch, nicht idealistisch.<\u002Fspan><span class=\"en\">Work hours, commutes and free slots. So Fit Forward plans realistically, not idealistically.<\u002Fspan><\u002Fp>\n      <\u002Farticle>\n      <article class=\"step reveal\" data-d=\"3\">\n        <div class=\"n\">3<\u002Fdiv>\n        <h3><span class=\"de\">Daten verbinden<\u002Fspan><span class=\"en\">Connect your data<\u002Fspan><\u002Fh3>\n        <p><span class=\"de\">Kopple Uhr und Wearables. Ab jetzt lernt dein Coach mit jeder Einheit dazu.<\u002Fspan><span class=\"en\">Pair your watch and wearables. From now on your coach learns with every session.<\u002Fspan><\u002Fp>\n        <div class=\"intg\">\n          <span>TrainingPeaks<\u002Fspan><span>Whoop<\u002Fspan><span>Apple Health<\u002Fspan><span>Strava<\u002Fspan><span>Polar<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ PROGRESS ============ -->\n<section class=\"section\" id=\"progress\" data-screen-label=\"Fortschritt\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\"><span class=\"de\">Fortschritt<\u002Fspan><span class=\"en\">Progress<\u002Fspan><\u002Fspan>\n      <h2 class=\"h2\"><span class=\"de\">Sieh, wie Konsistenz sich auszahlt.<\u002Fspan><span class=\"en\">See how consistency pays off.<\u002Fspan><\u002Fh2>\n      <p class=\"lead\"><span class=\"de\">Kein Rätselraten. Klare Trends zeigen dir, dass die kleinen, konstanten Einheiten dich messbar deinem Ziel näherbringen.<\u002Fspan><span class=\"en\">No guesswork. Clear trends show you that small, consistent sessions measurably bring you closer to your goal.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div class=\"grid g-3\" style=\"margin-top:54px\">\n      <article class=\"chartcard reveal\" data-d=\"1\">\n        <div class=\"ch-h\">\n          <h3><span class=\"de\">Fitness-Trend<\u002Fspan><span class=\"en\">Fitness trend<\u002Fspan><\u002Fh3>\n          <span class=\"delta\">▲ 18%<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"big\" data-count=\"18\" data-suffix=\"%\"><span>0<\u002Fspan><small><span class=\"de\"> / 12 Wo.<\u002Fspan><span class=\"en\"> / 12 wks<\u002Fspan><\u002Fsmall><\u002Fdiv>\n        <svg viewBox=\"0 0 300 120\" preserveAspectRatio=\"none\" style=\"margin-top:14px;height:120px\">\n          <defs><linearGradient id=\"fg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"var(--orange)\" stop-opacity=\".22\"><\u002Fstop><stop offset=\"1\" stop-color=\"var(--orange)\" stop-opacity=\"0\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n          <path class=\"area\" d=\"M0,96 L30,92 L60,86 L90,88 L120,74 L150,70 L180,58 L210,60 L240,44 L270,34 L300,26 L300,120 L0,120 Z\" fill=\"url(#fg)\" opacity=\"0\"><\u002Fpath>\n          <polyline class=\"trend\" points=\"0,96 30,92 60,86 90,88 120,74 150,70 180,58 210,60 240,44 270,34 300,26\" fill=\"none\" stroke=\"var(--orange)\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline>\n        <\u002Fsvg>\n        <p class=\"chart-cap\"><span class=\"de\">Deine Form steigt stetig — ohne Einbrüche.<\u002Fspan><span class=\"en\">Your form rises steadily — without dips.<\u002Fspan><\u002Fp>\n      <\u002Farticle>\n      <article class=\"chartcard reveal\" data-d=\"2\">\n        <div class=\"ch-h\">\n          <h3><span class=\"de\">Konsistenz<\u002Fspan><span class=\"en\">Consistency<\u002Fspan><\u002Fh3>\n        <\u002Fdiv>\n        <div class=\"big\" data-count=\"9\"><span>0<\u002Fspan><small><span class=\"de\"> Wochen<\u002Fspan><span class=\"en\"> weeks<\u002Fspan><\u002Fsmall><\u002Fdiv>\n        <div class=\"streak\" id=\"streak\"><\u002Fdiv>\n        <p class=\"chart-cap\"><span class=\"de\">9 Wochen in Folge mit ≥ 3 Einheiten.<\u002Fspan><span class=\"en\">9 weeks in a row with ≥ 3 sessions.<\u002Fspan><\u002Fp>\n      <\u002Farticle>\n      <article class=\"chartcard reveal\" data-d=\"3\">\n        <div class=\"ch-h\">\n          <h3><span class=\"de\">Ziel<\u002Fspan><span class=\"en\">Goal<\u002Fspan><\u002Fh3>\n        <\u002Fdiv>\n        <div class=\"big\" data-count=\"68\" data-suffix=\"%\"><span>0<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:18px\">\n          <div style=\"display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:8px\">\n            <b style=\"font-family:var(--head)\">Berlin Marathon<\u002Fb><span class=\"muted\">Sub 3:30<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"track\" style=\"height:10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden\">\n            <i style=\"display:block;height:100%;border-radius:999px;background:var(--navy);width:0;transition:width 1.2s cubic-bezier(.2,.7,.2,1)\" data-w=\"68\"><\u002Fi>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"chart-cap\"><span class=\"de\">Noch 14 Wochen — du bist im Plan.<\u002Fspan><span class=\"en\">14 weeks to go — you're on track.<\u002Fspan><\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CHECK-IN ============ -->\n<section class=\"section\" style=\"background:var(--paper-2)\" id=\"checkin\" data-screen-label=\"Check-in\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\" style=\"margin-bottom:48px\">\n      <span class=\"eyebrow\">Check-in<\u002Fspan>\n      <h2 class=\"h2\"><span class=\"de\">Ein kurzer Check-in. Ein klarer Plan.<\u002Fspan><span class=\"en\">A quick check-in. A clear plan.<\u002Fspan><\u002Fh2>\n      <p class=\"lead\"><span class=\"de\">Jeden Morgen 20 Sekunden. Fit Forward verrechnet Schlaf, HRV und dein Gefühl zu einem Bereitschafts-Score — und passt deinen Tag sofort an.<\u002Fspan><span class=\"en\">20 seconds every morning. Fit Forward combines sleep, HRV and how you feel into a readiness score — and adjusts your day instantly.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div class=\"chartcard reveal\" data-d=\"1\">\n      <div class=\"readwrap\">\n        <div class=\"gauge\">\n          <svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"43\" fill=\"none\" stroke=\"#e3dccf\" stroke-width=\"8\"><\u002Fcircle><circle class=\"rp\" cx=\"50\" cy=\"50\" r=\"43\" fill=\"none\" stroke=\"var(--orange)\" stroke-width=\"8\" stroke-linecap=\"round\" transform=\"rotate(-90 50 50)\" data-pct=\"82\"><\u002Fcircle><\u002Fsvg>\n          <div class=\"gv\"><b data-count=\"82\"><span>0<\u002Fspan><\u002Fb><span><span class=\"de\">Bereitschaft<\u002Fspan><span class=\"en\">Readiness<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;width:100%\">\n          <div class=\"checklist\">\n            <div class=\"checkrow\"><span class=\"k\"><span class=\"de\">Schlaf<\u002Fspan><span class=\"en\">Sleep<\u002Fspan><\u002Fspan><span class=\"track\"><i style=\"background:var(--navy)\" data-w=\"88\"><\u002Fi><\u002Fspan><span class=\"v\">7:42 h<\u002Fspan><\u002Fdiv>\n            <div class=\"checkrow\"><span class=\"k\">HRV<\u002Fspan><span class=\"track\"><i style=\"background:var(--navy)\" data-w=\"76\"><\u002Fi><\u002Fspan><span class=\"v\">64 ms<\u002Fspan><\u002Fdiv>\n            <div class=\"checkrow\"><span class=\"k\"><span class=\"de\">Ruhepuls<\u002Fspan><span class=\"en\">Resting HR<\u002Fspan><\u002Fspan><span class=\"track\"><i style=\"background:var(--navy)\" data-w=\"80\"><\u002Fi><\u002Fspan><span class=\"v\">48 bpm<\u002Fspan><\u002Fdiv>\n            <div class=\"checkrow\"><span class=\"k\"><span class=\"de\">Gefühl<\u002Fspan><span class=\"en\">Feel<\u002Fspan><\u002Fspan><span class=\"track\"><i style=\"background:var(--orange)\" data-w=\"70\"><\u002Fi><\u002Fspan><span class=\"v\"><span class=\"de\">Gut<\u002Fspan><span class=\"en\">Good<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:24px;display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;background:color-mix(in srgb,#1f9d55 12%,transparent)\">\n            <span style=\"width:9px;height:9px;border-radius:50%;background:#1f9d55;flex:none\"><\u002Fspan>\n            <span style=\"font-weight:600;color:#15703c\"><span class=\"de\">Grünes Licht — heute passt deine Schwellen-Einheit.<\u002Fspan><span class=\"en\">Green light — your threshold session fits today.<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ COACH ============ -->\n<section class=\"section surface-navy\" id=\"coach\" data-screen-label=\"Coach\">\n  <div class=\"wrap\">\n    <div class=\"coach\">\n      <div class=\"coach-art reveal\">\n        <div class=\"halo\"><\u002Fdiv>\n        <img src=\"8e2de0fb-5bd9-45ef-8cd4-d0fb5d38d59c\" alt=\"Fit Forward Wal-Coach\">\n      <\u002Fdiv>\n      <div class=\"reveal\" data-d=\"1\">\n        <span class=\"eyebrow\" style=\"color:var(--orange-300)\"><span class=\"de\">Dein Coach<\u002Fspan><span class=\"en\">Your coach<\u002Fspan><\u002Fspan>\n        <h2 class=\"h2\" style=\"margin-top:18px\"><span class=\"de\">Ruhig. Beständig.<br>Immer dabei.<\u002Fspan><span class=\"en\">Calm. Steady.<br>Always with you.<\u002Fspan><\u002Fh2>\n        <p class=\"lead\" style=\"margin-top:22px\"><span class=\"de\">Der Wal ist kein Zufall. Wale legen tausende Kilometer zurück — nicht im Sprint, sondern im Rhythmus. Genau so denkt dein Coach: kein Drill, kein schlechtes Gewissen. Nur die nächste richtige Einheit, immer dann, wenn sie passt.<\u002Fspan><span class=\"en\">The whale is no accident. Whales travel thousands of kilometres — not in a sprint, but in rhythm. That's exactly how your coach thinks: no drill, no guilt. Just the next right session, whenever it fits.<\u002Fspan><\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:30px;max-width:440px\">\n          <div class=\"coachbubble\"><span class=\"de\">„Deine Energie ist niedrig — heute reicht ein lockerer Lauf.“<\u002Fspan><span class=\"en\">“Your energy is low — an easy run is enough today.”<\u002Fspan><\u002Fdiv>\n          <div class=\"coachbubble alt\"><span class=\"de\">„Top erholt. Lass uns die Schwelle pushen.“<\u002Fspan><span class=\"en\">“Fully recovered. Let's push the threshold.”<\u002Fspan><\u002Fdiv>\n          <div class=\"coachbubble\"><span class=\"de\">„Stressiger Tag? 20 Minuten genügen, um dranzubleiben.“<\u002Fspan><span class=\"en\">“Stressful day? 20 minutes is enough to stay on track.”<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ TESTIMONIAL ============ -->\n<section class=\"section\" data-screen-label=\"Stimmen\">\n  <div class=\"wrap\" style=\"max-width:900px\">\n    <div class=\"quotecard reveal\">\n      <p><span class=\"de\">„Zum ersten Mal trainiere ich seit acht Monaten ohne Unterbrechung. Nicht, weil ich mehr Zeit hätte — sondern weil das Training endlich in mein Leben passt.“<\u002Fspan><span class=\"en\">“For the first time I've trained eight months without a break. Not because I have more time — but because the training finally fits my life.”<\u002Fspan><\u002Fp>\n      <footer>\n        <div class=\"av\" style=\"width:46px;height:46px;display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:1rem;color:var(--navy);background:var(--paper-2)\">LM<\u002Fdiv>\n        <div class=\"who\">\n          <b>Lena M.<\u002Fb>\n          <span><span class=\"de\">Produktmanagerin · läuft ihren ersten Marathon<\u002Fspan><span class=\"en\">Product manager · running her first marathon<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Ffooter>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FINAL CTA ============ -->\n<section class=\"section surface-navy cta-final\" id=\"cta\" data-screen-label=\"CTA\">\n  <img class=\"whale-deco\" src=\"8e2de0fb-5bd9-45ef-8cd4-d0fb5d38d59c\" alt=\"\" aria-hidden=\"true\" style=\"width:380px;left:-60px;bottom:-80px\">\n  <div class=\"wrap\" style=\"max-width:840px\">\n    <span class=\"eyebrow center reveal\" style=\"color:var(--orange-300)\"><span class=\"de\">Bereit?<\u002Fspan><span class=\"en\">Ready?<\u002Fspan><\u002Fspan>\n    <h2 class=\"display reveal\" data-d=\"1\"><span class=\"de\">Bleib dran.<br>Werde stärker.<\u002Fspan><span class=\"en\">Keep going.<br>Get stronger.<\u002Fspan><\u002Fh2>\n    <p class=\"lead reveal\" data-d=\"2\"><span class=\"de\">Sei von Anfang an dabei. Trag dich ein und sichere dir deinen Early Access — wir melden uns, sobald Fit Forward startet.<\u002Fspan><span class=\"en\">Be there from the start. Sign up and secure your early access — we'll reach out as soon as Fit Forward launches.<\u002Fspan><\u002Fp>\n    <form class=\"cta-form reveal\" data-d=\"3\" onsubmit=\"return false\">\n      <input type=\"email\" placeholder=\"deine@email.de\" aria-label=\"E-Mail / Email\">\n      <button class=\"btn btn-primary\" type=\"submit\"><span class=\"de\">Auf die Warteliste<\u002Fspan><span class=\"en\">Join the waitlist<\u002Fspan><\u002Fbutton>\n    <\u002Fform>\n    <p class=\"reveal\" data-d=\"3\" style=\"margin-top:18px;font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;color:rgba(238,241,246,.5)\"><span class=\"de\">Kein Spam · nur eine Nachricht zum Launch<\u002Fspan><span class=\"en\">No spam · just one message at launch<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FOOTER ============ -->\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"footer-top\">\n      <div>\n        <img class=\"footer-logo\" src=\"bba1a69e-28c0-441d-bbed-d60122a6a441\" alt=\"Fit Forward\">\n        <p style=\"max-width:30ch;font-size:.95rem\"><span class=\"de\">Ausdauertraining, das sich deinem Leben anpasst — nicht umgekehrt.<\u002Fspan><span class=\"en\">Endurance training that adapts to your life — not the other way around.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h4><span class=\"de\">Produkt<\u002Fspan><span class=\"en\">Product<\u002Fspan><\u002Fh4>\n        <
